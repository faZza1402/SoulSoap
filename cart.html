<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SoulSoap</title>
	<link rel="stylesheet" href="cart.css">
</head>

<body>
	<div class="wrapper">

		<header class="header">
			<div class="header-container">
				
				<a href="index.html">
					<img src="Main_images/logo.svg" alt="" class="header-logo">
				</a>

				<div class="search-n-nav">
					<div class="search">
						<img src="Main_images/search.svg">

						<form class="search-input">
							<input type="text" placeholder="Найти товары" id="search">
							<button class="search-btn">Найти</button>
						</form>
					</div>

					<nav class="nav">
						<ul>
							<li>
								<img src="Main_images/main.svg" alt="">
								<a href="index.html#main">Главная</a>
							</li>
							<li>
								<img src="Main_images/about.svg" alt="">
								<a href="index.html#about_us">О нас</a>
							</li>
							<li>
								<img src="Main_images/delivery.svg" alt="">
								<a href="index.html#delivery">Доставка и оплата</a>
							</li>
							<li>
								<img src="Main_images/comments.svg" alt="">
								<a href="index.html#comments">Отзывы</a>
							</li>
							<li>
								<img src="Main_images/contacts.svg" alt="">
								<a href="#contacts">Контакты</a>
							</li>
						</ul>
					</nav>
				</div>

				<div class="header-button-group">
					<a href="goods.html">
						<div class="header-btn">
							<img src="Main_images/catalogue.svg" alt="">
							<span>Каталог</span>
						</div>
					</a>

					<a href="#">
						<div class="header-btn account-open">
							<img src="Main_images/account.svg" alt="">
							<span>Войти</span>
						</div>
					</a>
				</div>
			</div>
		</header>

		<div class="account-wrap">

			<div class="account-content">

				<a href="#header" class="close">&times</a>

				<h1 class="acc-title">Вход</h1>

				<form class="account-form">

					<input type="text" placeholder="Логин" class="account-input" required>
					<input type="text" placeholder="Пароль" class="account-input" required>

					<button type="submit" class="account-btn">Войти</button>
					<button type="button" class="account-btn reg-open">Регистрация</button>
				
				</form>

			</div>

		</div>

		<div class="reg-wrap">
		
			<div class="reg-content">

				<a href="#header" class="close">&times</a>

				<h1 class="acc-title">Регистрация</h1>

				<form class="reg-form">

					<input type="text" placeholder="ФИО" class="account-input" required>
					<input type="text" placeholder="E-mail" class="account-input" required>
					<input type="text" placeholder="Пароль" class="account-input" required>
					<input type="text" placeholder="Повтор. пароль" class="account-input" required>

					<button type="submit" class="reg-btn">Зарегистрироваться</button>
			
				</form>

			</div>

		</div>

		<main class="main">

			<div class="empty-cart">
				<h1>Ваша корзина пуста</h1>
				<img src="Main_images/empty_cart.svg" alt="">
				<p>Загляните в каталог,<br> там много интересного</p>
				<a href="goods.html">
					<button class="place-an-order">Сделать заказ</button>
				</a>
			</div>
			
		</main>

		<footer class="footer" id="contacts">
			<div class="footer-container">

				<h1>Свяжитесь с нами</h1>

				<div class="contacts-container">
					<div class="left-side">
						<img src="Main_images/footer_logo.svg" alt="">
						
						<div class="icons-container">
							<a href="https://t.me/Soul_SoapElena"><img src="Main_images/telegram.svg"></a>
							<a href="https://vk.ru/vk.soulsoap"><img src="Main_images/vk.svg"></a>
							<a href="#"><img src="Main_images/inst.svg"></a>
						</div>
					</div>

					<div class="right-side">
						<p>Телефон: +7(915)004-36-77</p>

						<p>Электронная почта<br>
						sh.mynikname2017@gmail.com</p>
					</div>
				</div>

				<div class="decoration"></div>

				<a href="https://github.com/faZza1402/SoulSoap">made by faZza</a>

			</div>
		</footer>

	</div>

<script src="cart.js"></script>

</body>

</html>
