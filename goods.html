<!DOCTYPE html>
<html lang="ru">
<head>

	<title>SoulSoap</title>
	<link rel="stylesheet" href="goods.css">
</head>

<body>
	<div class="wrapper">

		<header class="header">
			<div class="header-container">
				
				<img src="Main_images/logo.svg" alt="" class="header-logo">

				<nav class="nav">
					<ul>
						<li><a href="#">Главная</a></li>
						<li><a href="#">О нас</a></li>

							<img src="Main_images/cart.svg" alt="">

				<div class="search">
					<img src="Main_images/search_white.svg" alt="">

						<button class="input-btn">Найти</button>
					</form>
				</div>
			</div>
		</main>

		<footer class="footer">

				<div class="contacts-container">
					<div class="left-side">
						<img src="Main_images/footer_logo.svg" alt="">
